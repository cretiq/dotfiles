# Laptop keyboard (AT Translated Set 2) and Apple Magic Keyboard with Touch ID; the Voyager is not listed, so it stays untouched.
# The Logitech X2 SUPERSTRIKE mouse is listed so Alt+Shift+left-drag can become Alt+middle-drag, GNOME's resize grab.
# On the Magic Keyboard, hid_apple swap_opt_cmd=2 already makes left Cmd send Alt, so the [alt] layers below apply to it.
[ids]
0001:0001
05ac:0321
046d:40bd
m:046d:40bd

[main]
capslock = esc
esc = capslock

[alt]
j = left
k = down
l = up
semicolon = right
i = C-left
o = C-right
s = C-S-tab
d = C-tab

# Slash commands, as in AHK SlashCommand. keyd emits US keycodes: "/" is S-7, ":" is S-dot and "-" is the slash key on the Swedish layout.
[alt+shift]
leftmouse = A-middlemouse
n = macro(S-7 n e x t space 100ms enter)
x = macro(S-7 c u t space 100ms enter)
c = macro(S-7 c o p y space 100ms enter)
o = macro(S-7 g i t S-dot c o m m i t slash d e t a i l e d slash p u s h space 100ms enter)
h = macro(S-7 h o w slash t o slash t e s t space 100ms enter)
d = macro(S-7 r e s t a r t space 100ms enter)
r = macro(S-7 r e s t a r t space 100ms enter)
e = macro(S-7 e l i 3 space 100ms enter)
l = macro(S-7 l o o k space 100ms enter)
w = macro(S-7 w i p space 100ms enter)
z = macro(S-7 g e n e r a t e S-dot s h o r t e r slash t i t l e space 100ms enter 300ms S-7 c o p y space 100ms enter 300ms S-7 r e n a m e space)

# Screenshot + paste into Claude. Runs below GNOME so a VM window grabbing the keyboard cannot block it; keyd runs as root, so drop to filip and give the script HOME and the session runtime dir.
[control+shift]
1 = command(runuser -u filip -- env HOME=/home/filip XDG_RUNTIME_DIR=/run/user/1000 /home/filip/.local/bin/shot-paste)
