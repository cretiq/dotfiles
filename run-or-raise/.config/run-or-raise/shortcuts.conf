# Run or Raise: focus the app if it runs, otherwise start it (replaces the AutoHotkey launchers).
# Voyager hyper = Ctrl+Shift+Super + Right Alt. On the Swedish layout Right Alt is AltGr (Mod5), not Alt,
# so every launcher is listed for both modifier sets until the live test shows which one fires.
# Reload after editing: gnome-extensions disable/enable run-or-raise@edvard.cz

# D: terminal
<Control><Alt><Shift><Super>d,ghostty,com.mitchellh.ghostty,
<Control><Shift><Super><Mod5>d,ghostty,com.mitchellh.ghostty,

# C: browser (Edge on Windows; Firefox until Edge is installed)
<Control><Alt><Shift><Super>c,firefox,,
<Control><Shift><Super><Mod5>c,firefox,,

# F: Documents folder
<Control><Alt><Shift><Super>f,nautilus /home/filip/Documents,org.gnome.Nautilus,
<Control><Shift><Super><Mod5>f,nautilus /home/filip/Documents,org.gnome.Nautilus,
