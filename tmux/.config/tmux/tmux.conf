# === Prefix ===
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# === Terminal / Display ===
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -g focus-events on

# === General ===
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 0

# === Keybindings ===
# Splits (current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -n 'M-=' split-window -h -c "#{pane_current_path}"
bind -n 'M--' split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Window switching with Alt+H/L
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-H previous-window
bind -n M-L next-window

# Pane resize (M-arrow via Ghostty shift+opt+arrows)
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up resize-pane -U 3
bind -n M-Down resize-pane -D 3

# Close pane (M-w via Ghostty cmd+opt+w / cmd+shift+w)
bind -n M-w kill-pane

# Clear screen (M-K via Ghostty cmd+shift+k / cmd+opt+z)
bind -n 'M-K' send-keys -R \; clear-history \; send-keys Enter

# Scroll (M-k/M-j via Ghostty shift+alt+k/j)
bind -n M-k copy-mode \; send-keys -X scroll-up
bind -n M-j copy-mode \; send-keys -X scroll-down

# Vim-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# === Plugins ===
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
# === Window naming ===
# Shell prompt → directory name | App running → app title [directory]
set -g automatic-rename on
set -g automatic-rename-format '#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_title} [#{b:pane_current_path}]}'

# === Catppuccin ===
# Auto-detect macOS appearance (fallback to mocha)
run-shell 'if defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark; then tmux set -g @catppuccin_flavor "mocha"; else tmux set -g @catppuccin_flavor "latte"; fi'

# Use window name (#W) instead of pane title (#T) so automatic-rename-format works
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_date_time}"
set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M"

# === Continuum ===
set -g @continuum-restore 'on'

# === TPM (keep at bottom) ===
run '~/.config/tmux/plugins/tpm/tpm'

# Force catppuccin re-apply on reload (TPM skips on re-source)
# Must unset @thm_* first — theme files use -o (only-if-not-set) flag
run-shell 'for v in bg fg crust mantle rosewater flamingo pink mauve red maroon peach yellow green teal sky sapphire blue lavender overlay_0 overlay_1 overlay_2 surface_0 surface_1 surface_2 subtext_0 subtext_1; do tmux set -gu @thm_$v; done'
run-shell '~/.config/tmux/plugins/tmux/catppuccin.tmux'

# === Overrides (after TPM/catppuccin) ===
# Let Ghostty control pane backgrounds (auto dark/light switching)
# catppuccin sets explicit bg — reset to inherit from terminal
set -g window-style bg=default
set -g window-active-style bg=default
set -g pane-border-lines double
set -g pane-active-border-style "fg=#{@thm_red}"
set -g pane-border-style "fg=#{@thm_surface_0}"
