# === Rosé Pine ===
# Variants: main (dark), moon (dark), dawn (light)
run-shell 'if defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark; then tmux set -g @rose_pine_variant "main"; else tmux set -g @rose_pine_variant "dawn"; fi'
set -g @rose_pine_date_time "%Y-%m-%d %H:%M"
set -g @rose_pine_show_current_program 'on'
set -g @rose_pine_show_pane_directory 'on'

# === Continuum ===
set -g @continuum-restore 'on'

# === TPM (keep at bottom) ===
run '~/.config/tmux/plugins/tpm/tpm'

